# 书桌办公照明：中性偏暖白，适合写字和阅读。
OFFICE_LIGHT_R=255
OFFICE_LIGHT_G=220
OFFICE_LIGHT_B=180

# 办公照明默认亮度；重新进入 WORK_LIGHT 时总是从这个值开始。
OFFICE_LIGHT_BRIGHTNESS_PERCENT=75

# 办公照明进入和退出时的渐亮/渐暗时长（秒）。
WORK_LIGHT_FADE_SECONDS=0.8

# 暖黄照明：适合放松、夜间氛围或不需要白光的场景。
WARM_LIGHT_R=255
WARM_LIGHT_G=140
WARM_LIGHT_B=40

# 暖黄光整体亮度，保持 RGB 比例不变。
WARM_LIGHT_BRIGHTNESS_PERCENT=100

# 确认用户打断播报时的短促青蓝闪光。只在 TTS 已真实取消后触发。
INTERRUPT_LIGHT_R=40
INTERRUPT_LIGHT_G=210
INTERRUPT_LIGHT_B=255
INTERRUPT_LIGHT_BRIGHTNESS_PERCENT=90
INTERRUPT_LIGHT_DURATION_MS=180

# WORK_LIGHT 中不改变色调，只将当前照明亮度轻微脉冲后恢复。
WORK_LIGHT_INTERRUPT_PULSE_PERCENT=10
