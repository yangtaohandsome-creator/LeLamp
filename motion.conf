# 从瘫痪的当前位置进入第一次动作首帧所需时间（秒）。越大越慢；设为 0 表示立即进入。
MOTION_PORT=/dev/serial/by-id/usb-1a86_USB_Single_Serial_5B61033217-if00

MOTION_STARTUP_TRANSITION_SECONDS=1.5

# 舵机已保持扭矩时，从当前姿态进入动作首帧所需时间（秒）。
MOTION_ACTIVE_TRANSITION_SECONDS=0.5

# 启动缓动每秒发送的控制帧数。通常保持 30 即可。
MOTION_TRANSITION_FPS=30

# 动作结束后移动到睡眠姿态所需时间（秒）。越大越慢。
MOTION_SLEEP_TRANSITION_SECONDS=1.5

# 到达睡眠姿态后继续保持扭矩的时间（秒），随后才释放扭矩。
MOTION_SLEEP_HOLD_SECONDS=1.0

# 进入高/低办公照明姿态的平滑时长（秒）。
MOTION_WORK_TRANSITION_SECONDS=1.5

# 视觉跟踪先平滑回到摄像头正对前方的独立中立姿态。该姿态不叠加、也不改写
# 用户通过 turn_base 保存的逻辑朝向；退出跟踪后才恢复原有待机朝向。
MOTION_TRACKING_HOME_TRANSITION_SECONDS=1.0

# 左右转动每一格的物理角度。Agent 只使用整格转动。
MOTION_BASE_YAW_STEP_DEGREES=30

# 相对最初正面的最大累计转角。当前校准和已确认情绪动作安全支持左右各 60 度。
MOTION_BASE_YAW_MAX_OFFSET_DEGREES=60

# base_yaw 正方向是否对应物理左转；若实机方向相反，只把 1 改成 -1。
MOTION_BASE_YAW_LEFT_SIGN=1

# 回答时是否允许 Agent 自动选择一个情绪动作，与 TTS 播报同步执行。
AUTO_EXPRESSION_ENABLED=1
# 办公照明时是否允许自动情绪动作；默认关闭，避免灯头移动导致桌面光线晃动。
# 用户明确要求执行动作时仍可通过 play_motion 正常执行。
AUTO_EXPRESSION_IN_WORK_LIGHT=0

# 当前实测可在断开舵机扭矩后稳定保持的睡眠姿态（校准后的关节值）。
MOTION_SLEEP_BASE_YAW=-0.22411474675033105
MOTION_SLEEP_BASE_PITCH=-36.48393194706995
MOTION_SLEEP_ELBOW_PITCH=100.0
MOTION_SLEEP_WRIST_ROLL=-1.3147082990961394
MOTION_SLEEP_WRIST_PITCH=50.68163592622295

# 唤醒后及普通动作结束后的待机姿态；待机期间保持舵机扭矩。
MOTION_STANDBY_BASE_YAW=0.5826983415508664
MOTION_STANDBY_BASE_PITCH=-44.990548204158785
MOTION_STANDBY_ELBOW_PITCH=58.46221829429962
MOTION_STANDBY_WRIST_ROLL=-1.3968775677896446
MOTION_STANDBY_WRIST_PITCH=47.634322373696875

# 视觉跟踪初始姿态。与待机姿态独立；2026-09-22 修正腕部关节命名时
# 仅交换两轴的字段，保持原有物理姿态。
MOTION_TRACKING_HOME_BASE_YAW=0
MOTION_TRACKING_HOME_BASE_PITCH=-44.990548204158785
MOTION_TRACKING_HOME_ELBOW_PITCH=58.46221829429962
MOTION_TRACKING_HOME_WRIST_ROLL=-45
MOTION_TRACKING_HOME_WRIST_PITCH=47.634322373696875

# 图像闭环控制。视觉推理仍按 vision.conf 的频率运行；舵机控制循环用最新结果
# 在较高固定频率下做平滑限速。响应矩阵由实机标定生成，不在这里猜测。
MOTION_TRACKING_CONTROL_HZ=25
MOTION_TRACKING_FEEDBACK_HZ=5
MOTION_TRACKING_SETPOINT_X=0.50
MOTION_TRACKING_SETPOINT_Y=0.42
MOTION_TRACKING_DEADZONE_X=0.035
MOTION_TRACKING_DEADZONE_Y=0.045
MOTION_TRACKING_POSITION_GAIN=2.0
MOTION_TRACKING_MAX_PREDICTION_SECONDS=0.12
MOTION_TRACKING_MAX_VELOCITY_BASE_YAW=18
MOTION_TRACKING_MAX_VELOCITY_WRIST_PITCH=15
MOTION_TRACKING_MAX_ACCELERATION_BASE_YAW=55
MOTION_TRACKING_MAX_ACCELERATION_WRIST_PITCH=45
MOTION_TRACKING_MIN_BASE_YAW=-55
MOTION_TRACKING_MAX_BASE_YAW=55
MOTION_TRACKING_MIN_WRIST_PITCH=40
MOTION_TRACKING_MAX_WRIST_PITCH=75

# 阅读照明模式姿态（当前仅保存，暂未接入自动切换）。
MOTION_READING_BASE_YAW=-1.56880322725236
MOTION_READING_BASE_PITCH=-23.345935727788287
MOTION_READING_ELBOW_PITCH=28.501988510826322
MOTION_READING_WRIST_ROLL=-2.2185702547247246
MOTION_READING_WRIST_PITCH=99.03769045709703

# 低照明阅读模式姿态。
MOTION_READING_LOW_BASE_YAW=-1.2998655311519514
MOTION_READING_LOW_BASE_PITCH=-39.79206049149339
MOTION_READING_LOW_ELBOW_PITCH=86.7432611577552
MOTION_READING_LOW_WRIST_ROLL=-2.382908792111749
MOTION_READING_LOW_WRIST_PITCH=49.71932638331998
