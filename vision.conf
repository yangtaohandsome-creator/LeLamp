# 是否启用正式视觉生命周期。视觉初始化失败不会阻止语音 app 启动。
VISION_ENABLED=1

# IMX179 Linux UVC 摄像头。数字字符串会按 /dev/videoN 设备编号处理。
VISION_CAMERA=/dev/video0
VISION_CAPTURE_WIDTH=640
VISION_CAPTURE_HEIGHT=480
VISION_CAPTURE_FPS=30
VISION_CAPTURE_FOURCC=MJPG
# 相机在灯头上的固定安装方向为侧转 90°；采集边界统一逆时针转正。
# 配置值按顺时针角度表达，因此 270° 等于逆时针 90°。
VISION_ROTATION=270
VISION_MODEL_WIDTH=240
VISION_MODEL_HEIGHT=320

# YuNet 与 Gesture Recognizer 使用同一最新帧，处理不过来时跳过旧帧。
VISION_INFERENCE_HZ=10
VISION_RESULT_MAX_AGE_MS=250
VISION_CAMERA_START_TIMEOUT_SECONDS=5

# 模型保留在 Pi 的视觉实验目录，不随代码同步或提交 Git。
VISION_YUNET_MODEL=~/lelamp_vision_eval/models/face_detection_yunet_2023mar.onnx
VISION_GESTURE_MODEL=~/lelamp_vision_eval/models/gesture_recognizer.task
VISION_FACE_SCORE_THRESHOLD=0.70
VISION_FACE_NMS_THRESHOLD=0.30
VISION_FACE_TOP_K=5000

# 单人桌面目标保持。面积均为归一化画面面积，距离为归一化坐标距离。
VISION_FACE_TARGET_MIN_AREA=0.025
VISION_FACE_TARGET_CENTER_WEIGHT=0.15
VISION_FACE_ASSOCIATION_MAX_DISTANCE=0.22
VISION_FACE_ASSOCIATION_MIN_IOU=0.05
VISION_FACE_ASSOCIATION_MIN_SIZE_RATIO=0.35
VISION_FACE_TARGET_PREDICT_SECONDS=0.30
VISION_FACE_TARGET_RELEASE_SECONDS=1.20
VISION_FACE_VELOCITY_SMOOTHING=0.45

VISION_MAX_HANDS=2
VISION_HAND_DETECTION_CONFIDENCE=0.50
VISION_HAND_PRESENCE_CONFIDENCE=0.50
VISION_HAND_TRACKING_CONFIDENCE=0.50
