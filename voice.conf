# 语音助手常用配置：修改后重启程序生效。
# 此文件优先于 .env 中同名参数；API 密钥继续放在 .env，不写入此文件。

# 唤醒词由下方关键词文件定义为“小灯”。阈值越低越灵敏，也越容易误唤醒。
KWS_THRESHOLD=0.05
# 关键词加分，越高通常越容易唤醒。
KWS_SCORE=2.0
# 唤醒词使用的 ReSpeaker 输入：mean、0 或 1。2026-09-11 实测 channel_1 命中 13 次，mean 为 8 次。
# 只影响 KWS；VAD 和 ASR 继续使用双声道平均音频。
KWS_AUDIO_CHANNEL=1
# 唤醒推理 CPU 线程数。
KWS_NUM_THREADS=1
# 唤醒模型目录和关键词文件，相对于启动时的 runtime 目录。
KWS_MODEL_DIR=kws_models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01
KWS_KEYWORDS_FILE=kws_models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01/keywords_xiao_deng.txt

# ALSA 麦克风和扬声器设备。
ARECORD_DEVICE=hw:seeed2micvoicec,0
APLAY_DEVICE=plughw:seeed2micvoicec,0
# 1 表示普通监听和 AEC 共用一条持续采音流；0 可回退到播报前后重开麦克风的旧方式。
VOICE_SHARED_CAPTURE=1
# ALSA dsnoop 让常驻普通监听与每轮 AEC 共享同一个底层麦克风，不重复打开硬件。
VOICE_SHARED_CAPTURE_DEVICE=dsnoop:CARD=seeed2micvoicec,DEV=0
# 软件扬声器音量百分比；当前硬件 mixer 已接近满量程，110 表示在原音量上提高约 10%。
APLAY_VOLUME_PERCENT=110
# 语音活动检测模式：silero 使用本地语音模型；rms 使用下方音量阈值备用逻辑。
VAD_MODE=silero
# Silero VAD 模型路径、判定阈值和线程数。阈值越低越灵敏。
VAD_MODEL_PATH=vad_models/silero_vad.onnx
VAD_MODEL_THRESHOLD=0.25
VAD_NUM_THREADS=1
# 连续多少秒非语音后断句。
VAD_MODEL_MIN_SILENCE_SECONDS=1.0
# 最短语音仅设为 0.05 秒，保留“是”“好”等极短回答。
VAD_MODEL_MIN_SPEECH_SECONDS=0.05

# 播报打断：无舵机运动时用 AEC + VAD 检测自然插话；舵机运动时只接受明确停止词。
BARGE_IN_ENABLED=1
# 排错时设为 1，每 0.5 秒打印 AEC 后音量和 VAD 状态；日常保持 0。
BARGE_IN_DEBUG=0
# 已实测效果较好的 ReSpeaker 通道、参考延迟和 WebRTC 回声抑制等级。
BARGE_IN_AEC_CHANNEL=0
BARGE_IN_AEC_DELAY_MS=80
BARGE_IN_AEC_LEVEL=low
# 检测到开口前保留的原始麦克风音频，防止新问题开头丢字。
BARGE_IN_PRE_ROLL_SECONDS=0.5
# 舵机静止时的独立 Silero 参数，不影响正常录音 VAD。
BARGE_IN_IDLE_VAD_THRESHOLD=0.40
BARGE_IN_IDLE_MIN_SPEECH_SECONDS=0.20
# 舵机运动时复用小型 KWS 模型，只识别“停、等等、行了、别说了、闭嘴”。
BARGE_IN_MOTION_KEYWORDS_FILE=lelamp/voice/keywords_interrupt.txt
BARGE_IN_MOTION_KWS_THRESHOLD=0.15
BARGE_IN_MOTION_KWS_SCORE=0.5
# 动作结束后等待舵机余音消退，再恢复自然插话检测。
BARGE_IN_MOTION_RELEASE_MS=300
# 开始说话的最低 RMS 阈值；程序还会结合现场噪声动态提高它，减少误触发。
# 以下 RMS 参数只在 VAD_MODE=rms 或模型缺失时负责断句，同时用于诊断输出。
VAD_START_RMS_THRESHOLD=0.008
# 已开始录音后的较低 RMS 阈值，用于保留轻声尾字。
VAD_CONTINUE_RMS_THRESHOLD=0.008
# 动态启动阈值等于近期噪声 RMS 的 90 分位乘以此系数，且不会低于上述最低值。
VAD_NOISE_MULTIPLIER=1.8
# 检测到开口时向前保留多少秒；现场测试 0.5 秒会漏掉“我想”，因此使用 1 秒。
VAD_PRE_ROLL_SECONDS=1.0
# 旧采音模式下，TTS 播放后重启麦克风时丢弃多少秒启动瞬态。
# 持续采音模式只在应用首次启动时使用该值，日常播报结束不再预热。
VAD_CAPTURE_WARMUP_SECONDS=0.8
# 连续低于持续阈值多少秒结束一句；调大可容纳更长的句中停顿。
VAD_SILENCE_SECONDS=1.2
# 尚无历史问答时，等待开始说话的最长秒数。
VAD_START_TIMEOUT_SECONDS=5.0
# 单句录音最长秒数。
VAD_MAX_SECONDS=15
# 连续多少秒没有识别到有效文字就结束会话；空 ASR、纯标点和调用失败不会重新计时。
CONVERSATION_IDLE_SECONDS=15
# 保存最近多少轮问答上下文，使用正整数。
CONVERSATION_HISTORY_TURNS=6

# ASR 服务地址。
ASR_WS_URL=ws://192.168.40.209:6006
# EOF 前追加的静音 PCM 秒数，范围 0～5；快速发送，无需实际等待该时长。
# 0 可关闭补齐；0.5 已在完整录音上验证能补出漏掉的尾字。
ASR_TAIL_SILENCE_SECONDS=0.5
# 当前使用 DeepSeek 官方 OpenAI 兼容接口；deepseek-flash 对应 V4.1-Flash。
LLM_BASE_URL=https://api.deepseek.com
LLM_MODEL=deepseek-flash
# 最大输出 token 数，不等于中文字数。
LLM_MAX_TOKENS=64
# 是否启用模型思考：0 关闭，1 开启；开启可能增加延迟。
LLM_ENABLE_THINKING=0
# Agent 后端：openclaw 或 pi。当前正式使用 Pi Agent，共用同一个 LampApp 和高层 Tool。
AGENT_BACKEND=pi
# OpenClaw Gateway 与 LeLamp Agent。Gateway token 放在 .env。
# 将 OpenClaw 迁移到独立主机时，只需修改此地址。
OPENCLAW_GATEWAY_URL=http://127.0.0.1:18789
OPENCLAW_AGENT_ID=lelamp
OPENCLAW_MODEL=openclaw/lelamp
# OpenClaw 的完整 Agent/Tool 回合上限；最终回答仍由人格提示限制为一两句。
OPENCLAW_MAX_TOKENS=512
# Pi Agent Core 本机服务。PI_AGENT_TOKEN 只放在 .env。
PI_AGENT_URL=http://127.0.0.1:18792
PI_AGENT_BIND=127.0.0.1
PI_AGENT_PORT=18792
# Pi Agent 会话仅保存在内存；空闲清理时间和最大会话数。
PI_AGENT_SESSION_TTL_SECONDS=1800
PI_AGENT_MAX_SESSIONS=32
# Pi Agent 的完整工具回合输出上限，与最终播报字数不是同一概念。
PI_AGENT_MAX_TOKENS=256
PI_AGENT_CONTEXT_WINDOW=32768
# 精简运行提示词；设为空则恢复 IDENTITY/SOUL/AGENTS 三份原文。
PI_AGENT_PROMPT_FILE=AGENT_RUNTIME.md
# 保留最近完整对话轮数（含工具结果）；0 恢复不限轮数。
PI_AGENT_HISTORY_TURNS=6
# 动态时间放到本轮输入尾部，固定前缀便于缓存；0 恢复旧方式。
PI_AGENT_STABLE_PREFIX=1
PI_SEARCH_TIMEOUT_MS=6000
# 应用启动时通过公网 IP 查询一次所在城市和时区；成功后覆盖持久配置，后续请求不重复定位。
LOCATION_LOOKUP_URL=https://ipwho.is/
# 单次启动定位的网络超时秒数；定位失败时不使用备用城市。
LOCATION_TIMEOUT_SECONDS=5
# 最近一次成功的定位配置，相对于 runtime 根目录；本次查询失败时继续复用，不影响已有功能。
LOCATION_CACHE_FILE=runtime_state/location.json
# Alarm 使用本次或上次成功定位得到的 IANA 时区，并持久化到以下文件。
ALARM_STATE_FILE=runtime_state/alarms.json
# OpenClaw Tool Plugin 调用的本机控制接口；控制 token 放在 .env。
# 迁移 OpenClaw 后可将 BIND 改为 Pi5 的局域网地址，并保持 token 验证。
LELAMP_CONTROL_BIND=127.0.0.1
LELAMP_CONTROL_PORT=18790
# 同事远程发送自然语言的独立入口；Token 只放在 .env。
# 该端口可供局域网访问，OpenClaw 和底层 Tool 端口仍只绑定本机。
LELAMP_REMOTE_BIND=0.0.0.0
LELAMP_REMOTE_PORT=18791
# Pi5 RP1 专用 WS281x 构建路径；普通电脑留空。
RPI_WS281X_DRIVER_PATH=
# 回答风格及对残缺语音的处理规则。
LLM_SYSTEM_PROMPT="你是小灯。用中文直接回答，最多两句话，每句话尽量简短，
不展示思考过程。输入来自语音识别，可能残缺。意思不明确且无法结合上下文确定时，
简短询问‘刚才没听清，你再说一遍？’，不要擅自补全问题，也不要默认理解成询问你的身份。
‘是’‘好’‘不用’等短回答应结合上下文正常理解。"
# TTS 后端：edge 使用 Xiaoxiao 在线音色；remote 使用同事的局域网服务。
TTS_BACKEND=edge
# Edge 失败后的回退：remote 使用同事服务，none 表示不回退。
TTS_FALLBACK_BACKEND=none
EDGE_TTS_VOICE=zh-CN-XiaoxiaoNeural
EDGE_TTS_RATE=+10%
EDGE_TTS_VOLUME=+0%
EDGE_TTS_PITCH=+0Hz
# 唤醒时后台预连接；文本就绪后最多等这么久，再按上方配置处理失败。
EDGE_TTS_READY_WAIT_SECONDS=0.15
EDGE_TTS_CONNECT_TIMEOUT_SECONDS=3.0
EDGE_TTS_RECEIVE_TIMEOUT_SECONDS=30.0
# 已连接但合成失败时快速重连一次；仍失败则按上方配置处理。
EDGE_TTS_RETRY_COUNT=1
EDGE_TTS_RETRY_TIMEOUT_SECONDS=3.0
# 同事的 PCM 流式语音服务地址，也是 Edge 的回退服务。
TTS_URL=http://192.168.40.209:8200/v1/tts/stream

# 诊断开关：1 保存输入 WAV、ASR 响应并打印日志；0 关闭。
# 诊断开启时会在首个 final 后额外观察响应，最多 2 秒，计入 ASR 延迟。
VOICE_DEBUG=1
# 主程序诊断目录；每轮分别保存原始录音和追加静音后的 ASR 输入。
VOICE_DEBUG_DIR=voice_debug
# 独立 VAD 诊断程序的输出目录。
VOICE_DIAGNOSTIC_DIR=voice_debug/vad_tests
# 独立诊断程序启动后先丢弃并统计声卡启动音频，避免首块瞬态误触发。
VAD_DIAGNOSTIC_CALIBRATION_SECONDS=1.0
